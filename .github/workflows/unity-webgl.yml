name: Unity WebGL → Pages
on:
  push:
    branches: [main]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**', '.github/workflows/unity-webgl.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Unity job at a time for the whole repository (docs/CI.md section 1). A Unity Personal seat is held from activation until
# the build container returns it, and a Personal account has very few seats. cancel-in-progress must stay false: cancelling a
# running job can leak the seat and every later run then fails with "no available seats". Queued builds wait their turn (GitHub
# keeps only the newest pending one). The group is set on the BUILD JOB, not on the workflow (paket C1): the Playwright screenshot
# job and the Pages deploy do not use a Unity seat and must not hold the next build back. Any other workflow that starts Unity
# (unity-android.yml) puts its build job in this same group.

jobs:
  build:
    name: Build WebGL (GameCI)
    runs-on: ubuntu-latest
    concurrency:
      group: unity-license
      cancel-in-progress: false
    # With cancel-in-progress: false a hung Unity job would block the queue (and hold the seat) for the 6 hour default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check for a scene
        id: scene
        run: |
          if ls Assets/MinikUsta/Scenes/*.unity >/dev/null 2>&1; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::No scene yet (Phase 3 adds Assets/MinikUsta/Scenes); build skipped."; fi
      # Guard for docs/CI.md section 2b (validateBuild). unity-builder v6 runs the game-ci CLI, which fails the Build step even when
      # Unity exits 0 unless the container output contains the literal "Build succeeded!". A custom buildMethod must print it
      # itself: CiBuild.ReportSuccess does, once per entry point. This step turns a deleted call into a failure within seconds
      # instead of a full Unity run (about 9 minutes in run 41350760117) that ends red. Source of the contract: game-ci/cli v0.1.72, unity-build-validation.ts.
      - name: Check CiBuild reports success to the GameCI CLI
        if: steps.scene.outputs.has == 'true'
        run: |
          f=Assets/MinikUsta/Editor/CiBuild.cs
          if ! grep -qF 'Console.WriteLine("Build succeeded!");' "$f"; then
            echo "::error file=$f::CiBuild.cs no longer prints the literal 'Build succeeded!' that the game-ci CLI (validateBuild) requires; see docs/CI.md section 2b"
            exit 1
          fi
          calls=$(grep -cF 'ReportSuccess(report.summary);' "$f" || true)
          if [ "$calls" -lt 2 ]; then
            echo "::error file=$f::ReportSuccess(report.summary) must be called in BuildWebGL and BuildAndroid (found $calls call(s)); see docs/CI.md section 2b"
            exit 1
          fi
      # Fail early with a readable message instead of a licensing error 5 minutes into the container. Values are never printed.
      - name: Check Unity account secrets
        if: steps.scene.outputs.has == 'true'
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::UNITY_EMAIL / UNITY_PASSWORD repository secrets are not set (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 1
          fi
      - name: Cache Library
        if: steps.scene.outputs.has == 'true'
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-
      # unity-builder v6 is a thin wrapper around the game-ci CLI. The CLI reads UNITY_EMAIL / UNITY_PASSWORD from this step's
      # environment (never as arguments) and, with only these two set, activates a Personal seat through the Unity licensing
      # client and returns it in an EXIT trap when the container ends. No .ulf is needed.
      #
      # UNITY_LICENSE is deliberately NOT passed: in auto mode a non-empty UNITY_LICENSE selects the .ulf route first, which cannot
      # work on an ephemeral container (the file is bound to the machine that made it).
      #
      # cliVersion is pinned (the default is "latest"). v0.1.66 fixed the Personal seat return; v0.1.72 is the newest CLI release
      # (2026-10-03) and also carries the later licensing and return-retry fixes. Bump deliberately, not by accident.
      #
      # unityVersion is left at its default ("auto"): the CLI reads ProjectSettings/ProjectVersion.txt (6000.0.85f1), so the
      # editor version has a single source of truth. Image: unityci/editor:ubuntu-6000.0.85f1-webgl-3.
      #
      # Output path is unchanged from v4: build/WebGL/MinikUsta (buildsPath default "build" + targetPlatform + buildName).
      #
      # The buildMethod contract did change from v4: the CLI also scans the container output for "Build succeeded!" (see the
      # guard step above). CiBuild.BuildWebGL prints it after a successful BuildPlayer; Unity's exit code alone is not enough.
      #
      # continue-on-error: the CLI can still turn a good build red after Unity has finished (run 41350760117: Unity exit code 0,
      # player written, then "at validateBuild" and "Build failed with exit code 1"; the seat-return lines before it are noise,
      # docs/CI.md section 2b). The next step, "Verify WebGL output", decides success from the files on disk, and everything
      # downstream (Pages artifact, deploy) is gated on that step, never on this one. A real build failure still ends the job red
      # because Verify finds no player. steps.build.outcome keeps the true result of this step and Verify prints it.
      - name: Build
        id: build
        continue-on-error: true
        if: steps.scene.outputs.has == 'true'
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.72
          targetPlatform: WebGL
          buildName: MinikUsta
          buildMethod: MinikUsta.Editor.CiBuild.BuildWebGL
          allowDirtyBuild: true
      # Success is defined by the player on disk. CiBuild.BuildWebGL builds with Gzip + decompression fallback (P4B-04), so Build/ holds
      # `*.wasm.unityweb` / `*.data.unityweb` (or `.gz` / `.br` / plain files if that setting changes); the globs below accept all of them. Files must be non-empty. The workspace is fresh on
      # every run (only Library is cached), so a stale player from an earlier run cannot satisfy this check.
      - name: Verify WebGL output
        id: verify
        if: steps.scene.outputs.has == 'true'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          dir=build/WebGL/MinikUsta
          sudo chown -R "$USER" build 2>/dev/null || true
          echo "Files in $dir (bytes, path):"
          if [ -d "$dir" ]; then
            find "$dir" -type f -printf '%10s  %P\n' | sort -k2
            du -sh "$dir"
          else
            echo "(directory does not exist)"
          fi
          shopt -s nullglob
          # Succeeds when at least one of the given paths is a non-empty regular file.
          any_nonempty() { local f; for f in "$@"; do [ -s "$f" ] && return 0; done; return 1; }
          missing=()
          any_nonempty "$dir/index.html" || missing+=("index.html")
          any_nonempty "$dir"/Build/*.wasm* || missing+=("Build/*.wasm*")
          any_nonempty "$dir"/Build/*.data* || missing+=("Build/*.data*")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing or empty: ${missing[*]}"
            echo "::error::Unity build produced no WebGL player (see the Build step log)"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "WebGL player is complete (index.html, Build/*.wasm*, Build/*.data*)."
          # P4B-04: the first-visit download. With Gzip + decompression fallback (CiBuild.BuildWebGL) the files on disk ARE what the
          # browser downloads (GitHub Pages sends no Content-Encoding for them); Disabled was 48,6 MB in run 41386489687.
          bytes=$(stat -c %s "$dir"/Build/*.data* "$dir"/Build/*.wasm* 2>/dev/null | awk '{s+=$1} END {print s+0}')
          mb=$(( ${bytes:-0} / 1048576 ))
          echo "Download size of Build/*.data* + Build/*.wasm*: ${bytes:-0} bytes (${mb} MB); budget 25 MB (docs/CI.md section 9)."
          echo "### WebGL download size: ${mb} MB (.data + .wasm; budget 25 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${bytes:-0}" -gt 26214400 ]; then
            echo "::warning title=WebGL download size::.data + .wasm are ${mb} MB (budget 25 MB): the first visit on a mobile network will miss the 10 second FTUE target"
          fi
          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "::warning::The Build step reported '$BUILD_OUTCOME' although Unity produced a complete WebGL player; continuing. Read the Build step log (docs/CI.md section 2b, validateBuild)."
          fi
      # P3-05: Unity writes the settings assets and the .meta files it generates into the workspace. Upload them (also when the build
      # failed) so the owner can commit them after the first green run: GUIDs become stable and the Library cache stops missing.
      # How: docs/CI.md section 4. The chown is needed because the container ran as root.
      # Skipped when the Build step never ran (for example the secret check failed): the workspace would only hold repository files.
      - name: Collect files Unity generated
        if: always() && steps.scene.outputs.has == 'true' && steps.build.conclusion != 'skipped'
        run: sudo chown -R "$USER" ProjectSettings Packages Assets
      - name: Upload files Unity generated (ProjectSettings, .meta)
        if: always() && steps.scene.outputs.has == 'true' && steps.build.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: unity-generated-files
          path: |
            ProjectSettings/
            Packages/packages-lock.json
            Assets/**/*.meta
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare Pages artifact
        if: steps.verify.outputs.ok == 'true'
        run: |
          sudo chown -R "$USER" build
          ls -la build/WebGL/MinikUsta
          touch build/WebGL/MinikUsta/.nojekyll
          # CL-V3-02: the page says what it is until the owner has played the v3b levels (dead-state gate is an estimate there)
          if [ -f build/WebGL/MinikUsta/index.html ]; then
            sed -i 's#<title>\([^<]*\)</title>#<title>\1 - levels v3b preview</title>#' build/WebGL/MinikUsta/index.html
          fi
      - name: Upload Pages artifact
        if: steps.verify.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/MinikUsta
      # The screenshot job (below) plays the exact player that goes to Pages. A separate, short-lived artifact: the Pages artifact is
      # a tar meant for deploy-pages, and this one downloads as a plain folder.
      - name: Upload the player for the screenshot job
        if: steps.verify.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: webgl-player
          path: build/WebGL/MinikUsta
          retention-days: 3
          if-no-files-found: error
    outputs:
      has_scene: ${{ steps.scene.outputs.has }}
      player_verified: ${{ steps.verify.outputs.ok }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # needs.build.result must be success (implicit), and the Pages artifact exists only when Verify passed.
    if: needs.build.outputs.has_scene == 'true' && needs.build.outputs.player_verified == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Paket C1: screenshots of the built player, for the reviewers (docs/CI.md section 7). Headless Chromium with software GL plays
  # the game with ?shots=1 (Presentation.Core/Shots/ShotScenario.cs) on 390x844 and 360x800 and saves a PNG at every
  # "[minikShot] shot:<name>" console line (tools/ci-shots/shoot.mjs). The PNGs and a manifest.json go to the orphan branch
  # `ci-shots` (tools/ci-shots/publish.sh) and to a workflow artifact. Nothing here may block the release: the job is
  # continue-on-error, every step reports problems as ::warning:: and the Pages deploy does not wait for it.
  screenshots:
    name: CI screenshots (Playwright)
    needs: build
    if: needs.build.outputs.player_verified == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    permissions:
      contents: write   # push to the ci-shots branch with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/ci-shots
          persist-credentials: false
      - name: Download the WebGL player
        uses: actions/download-artifact@v4
        with:
          name: webgl-player
          path: player
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Playwright is pinned in tools/ci-shots/package.json (1.64.1, checked on npm 2026-11-01) with its lock file.
      - name: Install Playwright and Chromium
        id: pw
        continue-on-error: true
        working-directory: tools/ci-shots
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        id: shoot
        if: steps.pw.outcome == 'success'
        continue-on-error: true
        run: node tools/ci-shots/shoot.mjs --dir player --out artifacts/shots --sha "$GITHUB_SHA"
      # U2 (UX_UNITY K1): EXPAND is the default now, so the comparison run is the old FIT (?scale=fit) for three of the shots, saved under
      # artifacts/shots/fit and published with the rest; its failure never matters.
      - name: Capture screenshots (scale=fit)
        id: shoot_fit
        if: steps.shoot.outcome == 'success'
        continue-on-error: true
        run: node tools/ci-shots/shoot.mjs --dir player --out artifacts/shots/fit --sha "$GITHUB_SHA" --query scale=fit --only level_start,tutorial,win --no-motion
      - name: Upload screenshots (artifact)
        if: always() && hashFiles('artifacts/shots/manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshots
          path: artifacts/shots
          retention-days: 14
      - name: Publish to the ci-shots branch
        if: always() && hashFiles('artifacts/shots/manifest.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOTS_DIR: artifacts/shots
          SHA: ${{ github.sha }}
        run: bash tools/ci-shots/publish.sh
      - name: Report
        if: always()
        run: |
          if [ "${{ steps.pw.outcome }}" != "success" ]; then echo "::warning title=CI screenshots::Playwright could not be installed; no screenshots for this commit"; fi
          if [ "${{ steps.shoot.outcome }}" != "success" ] && [ "${{ steps.pw.outcome }}" = "success" ]; then echo "::warning title=CI screenshots::the capture step failed; see its log"; fi
          if [ -f artifacts/shots/manifest.json ]; then
            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('artifacts/shots/manifest.json'))
          print('### CI screenshots of ' + d['shortSha'] + ' (ok = ' + str(d['ok']) + ')')
          print('')
          print('Branch `ci-shots`: `latest/` and `' + d['shortSha'] + '/` (`bash tools/ci-shots/fetch.sh`). Shots: ' + ', '.join(d['shots']) + '.')
          for name, v in d['viewports'].items():
              print('- ' + name + ': ' + str(len(v['screens'])) + '/' + str(len(d['shots'])) + ' screens' + (', errors: ' + '; '.join(v['errors']) if v['errors'] else ''))
              a = v.get('art3d')
              if a:
                  print('  - 3D page decode: ' + str(a['totalMs']) + ' ms (budget ' + str(a['budgetMs']) + ' ms), during play: ' + (', '.join(a['lateDecodes']) or 'none'))
              for sq, m in (v.get('motion') or {}).items():
                  if m.get('pictures'):
                      print('  - motion ' + sq + ': ' + str(m['pictures']) + ' pictures, ' + str(m['uniquePictures']) + ' unique, ' + str(m['changedPairs']) + ' changed pairs, ' + str(m['changesPerGameSecond']) + ' changes per game second' + (' (undersampled)' if m.get('undersampled') else '') + ', strip ' + m['strip'])
                  else:
                      print('  - motion ' + sq + ': ' + str(m.get('error')))
          for w in d.get('warnings', []):
              print('- warning: ' + w)
          PY
          fi
