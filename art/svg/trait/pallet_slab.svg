<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 6" width="120" height="6" data-scale="2" data-pivot="0.5 0.5">
<!-- D-108 (tokens check.palletV3c.sled layerEdge*): the bottom edge of a covered pallet layer, 6 px under the layer above: a 3 px
     layerEdge line (#2E3A4B, alpha .55) over a light band the game tints with the layer's block colour (BlockSkin). Exactly one cell
     wide with flat ends, so the bands of neighbouring cells join without a seam. -->
<defs><linearGradient id="bn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B8B8B8"/></linearGradient></defs>
<rect x="0" y="0" width="120" height="6" fill="url(#bn)"/>
<rect x="0" y="0" width="120" height="3" fill="#2E3A4B" fill-opacity=".55"/>
</svg>
